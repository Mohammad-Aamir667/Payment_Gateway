version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: payment_gateway_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: